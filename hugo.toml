baseURL = 'https://gannonlawlor.com/'
locale = 'en-us'
title = 'Gannon Lawlor'
theme = ["PaperMod"]

[params]
  cloudflareAnalyticsToken = ""  # Set via HUGO_PARAMS_CLOUDFLAREANALYTICSTOKEN environment variable
  [params.assets]
    favicon = "/favicon/favicon.ico"
    favicon16x16 = "/favicon/favicon-16x16.png"
    favicon32x32 = "/favicon/favicon-32x32.png"
    apple_touch_icon = "/favicon/apple-touch-icon.png"
    safari_pinned_tab = "/favicon/favicon.ico"

[params.homeInfoParams]
  Title = "Hi, I'm Gannon 👋"
  Content = """
I'm a software engineer with 12 years of experience shipping products used by millions, from big tech at **Meta**, **Peloton** and **Twitter** to early-stage startups.
I build across the full stack, from web frontends and backend services to native mobile apps on Android and iOS, and I've led features from first prototype to global launch.
"""

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/gannonlawlor"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/gannonlawlor/"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

