baseURL = 'https://gannonlawlor.com/'
locale = 'en-us'
title = 'Gannon Lawlor'
theme = ["PaperMod"]

[params]
  cloudflareAnalyticsToken = ""  # Set via HUGO_PARAMS_CLOUDFLAREANALYTICSTOKEN environment variable
  [params.assets]
    favicon = "/favicon/favicon.ico"
    favicon16x16 = "/favicon/favicon-16x16.png"
    favicon32x32 = "/favicon/favicon-32x32.png"
    apple_touch_icon = "/favicon/apple-touch-icon.png"
    safari_pinned_tab = "/favicon/favicon.ico"

[params.homeInfoParams]
  Title = "Hi, I'm Gannon."
  Content = """
I'm a software engineer with 12 years of experience. I've worked at **Meta**, **Peloton**, and **Twitter**, as well as early-stage startups.

I've built web apps, backend services, and native apps for Android and iOS. I've worked in large codebases running on billions of devices, and built products from scratch with small teams, adapting them as they grew from their first few users.

You can find my code on [GitHub](https://github.com/gannonlawlor) or get in touch on [LinkedIn](https://www.linkedin.com/in/gannonlawlor/).
"""

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/gannonlawlor"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/gannonlawlor/"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

